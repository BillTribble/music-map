<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Tribble Music Map</title>
  <script>
    (function () {
      function showBootErr(msg) {
        var el = document.getElementById("boot-banner");
        if (!el) return;
        el.textContent = msg;
        el.hidden = false;
      }
      window.addEventListener("error", function (e) {
        if (e && e.message) showBootErr("Script error: " + e.message);
      });
      setTimeout(function () {
        if (!window.__APP_LOADED__) showBootErr("App initialization timed out. Check local script assets.");
      }, 4000);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="css/gm3-color-tokens.css?v=20261124b" />
  <link rel="stylesheet" href="css/app.css?v=20261124b" />
  <link rel="stylesheet" href="css/map.css?v=20261124b" />
  <link rel="stylesheet" href="css/views.css?v=20261124b" />
</head>
<body>
  <div id="boot-banner" class="boot-banner" hidden></div>

  <header class="app-bar" role="banner">
    <button id="menu-toggle" type="button" class="icon-btn" aria-label="Toggle navigation" aria-expanded="false" title="Toggle navigation">
      <span class="ms">menu</span>
    </button>
    <h1 class="app-title">
      <span class="app-brand-mark ms filled">graphic_eq</span>
      <span>Bill Tribble Music Map</span>
    </h1>
    <div class="bar-spacer"></div>
    <div id="top-switch" class="m3-pill-tabs gm3-connected-dsp" role="group" aria-label="View mode"></div>
    <div id="search-wrap" class="search">
      <button id="search-open" type="button" class="icon-btn" aria-label="Search tracks" title="Search tracks, keys or styles">
        <span class="ms">search</span>
      </button>
      <div class="search-field">
        <span class="ms" style="font-size:18px">search</span>
        <input id="search-input" type="text" placeholder="Filter tracks, key, era…" autocomplete="off" />
        <button id="search-close" type="button" class="search-clear" aria-label="Clear search" title="Clear">
          <span class="ms" style="font-size:18px">close</span>
        </button>
      </div>
    </div>
    <button id="now-playing-chip" type="button" class="now-chip" hidden title="Stop playback">
      <span class="ms filled" style="font-size:16px">stop</span>
      <span id="now-playing-name" class="now-chip-name"></span>
    </button>
    <button id="settings-open" type="button" class="icon-btn" aria-label="Settings" aria-expanded="false" title="Settings & theme">
      <span class="ms">tune</span>
    </button>
  </header>

  <div class="app-shell">
    <nav id="side-nav" class="side-nav" role="navigation" aria-label="Primary navigation"></nav>
    <div id="nav-scrim" class="nav-scrim"></div>

    <main class="workspace" role="main">
      <section id="map" class="map" aria-label="Track similarity and era node map">
        <div id="map-mobile-toggle" class="m3-pill-tabs gm3-connected-dsp map-mobile-toggle"></div>
        <svg id="map-svg" class="map-svg" role="img" aria-label="Interactive music evolution node map"></svg>
        <div id="map-legend" class="map-legend"></div>
        <aside id="map-panel" class="map-panel" hidden></aside>
      </section>

      <section id="analysis-shell" class="analysis-shell" hidden>
        <div id="era-strip" class="era-strip"></div>
        <div id="view-stage" class="view-card"></div>
        <div id="era-inspector" class="era-inspector"></div>
      </section>
    </main>
  </div>

  <div id="settings-popover" class="settings-pop" hidden>
    <div class="set-row">
      <div>
        <div class="set-lbl">Audio</div>
        <div class="set-sub">Audition track loops</div>
      </div>
      <label class="m3-switch" aria-label="Enable audio">
        <input id="set-mute" type="checkbox" checked />
        <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
      </label>
    </div>
    <div class="set-row">
      <span class="set-lbl">Volume</span>
      <input id="set-vol" class="gm3-slider" type="range" min="0" max="1" step="0.02" value="0.85" style="width:148px" aria-label="Master volume" />
    </div>
    <div class="set-row">
      <span class="set-lbl">Node color</span>
      <div class="m3-pill-tabs gm3-connected-dsp">
        <button type="button" class="m3-pill-tab is-active" data-set-color="cluster">Style</button>
        <button type="button" class="m3-pill-tab" data-set-color="energy">Energy</button>
        <button type="button" class="m3-pill-tab" data-set-color="era">Phase</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-lbl">Theme</span>
      <div class="m3-pill-tabs gm3-connected-dsp">
        <button type="button" class="m3-pill-tab is-active" data-set-theme="auto">Auto</button>
        <button type="button" class="m3-pill-tab" data-set-theme="light">Light</button>
        <button type="button" class="m3-pill-tab" data-set-theme="dark">Dark</button>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=20261124b"></script>
  <script src="js/audio-deck.js?v=20261124b"></script>
  <script src="js/nodemap.js?v=20261124b"></script>
  <script src="js/views-harmony.js?v=20261124b"></script>
  <script src="js/views-evolution.js?v=20261124b"></script>
  <script src="js/app.js?v=20261124b"></script>
</body>
</html>
