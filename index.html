<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Bill Tribble Music Map</title>
  <meta name="description" content="Interactive sonic atlas and evolutionary music map of Bill Tribble's catalog from 2001 to 2026 — Vibe clusters, Energy-Wave Era timeline, and harmonic analysis." />
  <meta property="og:title" content="Bill Tribble Music Map" />
  <meta property="og:description" content="Interactive sonic atlas of Bill Tribble's music archive, releases, vibe clusters, and 2001–2026 evolution." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://billtribble.github.io/music-map/" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Bill Tribble Music Map",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "url": "https://billtribble.github.io/music-map/",
      "author": {
        "@type": "Person",
        "name": "Bill Tribble",
        "url": "https://billtribble.com"
      }
    }
  </script>
  <script>
    (function () {
      function showBootErr(msg) {
        var el = document.getElementById("boot-banner");
        if (!el) return;
        el.textContent = msg;
        el.hidden = false;
      }
      window.addEventListener("error", function (e) {
        if (e && e.message) showBootErr("Script error: " + e.message);
      });
      setTimeout(function () {
        if (!window.__APP_LOADED__) showBootErr("App initialization timed out. Check local script assets.");
      }, 4500);
    })();
  </script>
  <script>
    (function () {
      var THEME_KEY = "btmm.theme";
      var MIGRATION_KEY = "btmm.theme_v2";
      var mode = "auto";
      try {
        if (localStorage.getItem(MIGRATION_KEY) !== "1") {
          localStorage.removeItem(THEME_KEY);
          localStorage.removeItem("me.theme");
          localStorage.setItem(MIGRATION_KEY, "1");
          localStorage.setItem(THEME_KEY, "auto");
        } else {
          var saved = localStorage.getItem(THEME_KEY);
          if (saved === "auto" || saved === "light" || saved === "dark") {
            mode = saved;
          }
        }
      } catch (_) {}

      function resolveAuto() {
        try {
          if (window.parent && window.parent !== window && window.parent.document) {
            var pt = window.parent.document.documentElement.getAttribute("data-theme");
            if (pt === "dark" || pt === "light") return pt;
          }
        } catch (_) {}
        try {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            return "dark";
          }
        } catch (_) {}
        return "light";
      }

      var resolved = mode === "auto" ? resolveAuto() : mode;
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.setAttribute("data-theme-mode", mode);
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="css/gm3-color-tokens.css?v=20261124v" />
  <link rel="stylesheet" href="css/app.css?v=20261124v" />
  <link rel="stylesheet" href="css/map.css?v=20261124v" />
  <link rel="stylesheet" href="css/views.css?v=20261124v" />
  <link rel="stylesheet" href="css/theme-personal.css?v=20261124v" />
  <script data-goatcounter="https://billtribble-com.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="boot-banner" class="boot-banner" hidden></div>

  <header class="app-bar" role="banner">
    <button id="menu-toggle" type="button" class="icon-btn" aria-label="Toggle navigation" aria-expanded="false" title="Toggle navigation">
      <span class="ms">menu</span>
    </button>
    <h1 class="app-title">
      <span class="app-brand-mark ms filled">graphic_eq</span>
      <span>Bill Tribble Music Map</span>
    </h1>
    <div class="bar-spacer"></div>
    <div id="search-wrap" class="search">
      <button id="search-open" type="button" class="icon-btn" aria-label="Search tracks" title="Search tracks, keys or styles">
        <span class="ms">search</span>
      </button>
      <div class="search-field">
        <span class="ms" style="font-size:18px">search</span>
        <input id="search-input" type="text" placeholder="Filter tracks, genre, mood, key…" autocomplete="off" />
        <button id="search-close" type="button" class="search-clear" aria-label="Clear search" title="Clear">
          <span class="ms" style="font-size:18px">close</span>
        </button>
      </div>
    </div>
    <button id="theme-toggle-btn" type="button" class="icon-btn" aria-label="Theme: Auto (system)" title="Theme: Auto (system)">
      <span id="theme-toggle-icon" class="ms">brightness_auto</span>
    </button>
    <button id="settings-open" type="button" class="icon-btn" aria-label="Settings" aria-expanded="false" title="Settings &amp; theme">
      <span class="ms">tune</span>
    </button>
  </header>

  <div class="app-shell">
    <nav id="side-nav" class="side-nav" role="navigation" aria-label="Primary navigation"></nav>
    <div id="nav-scrim" class="nav-scrim"></div>

    <main class="workspace" role="main">
      <section id="map" class="map" aria-label="Bill Tribble Music Map Vibe and Era canvas">
        <div id="map-floating-hud" class="map-floating-hud" role="toolbar" aria-label="Map mode and track filters">
          <div class="map-hud-pill">
            <div id="map-mode-tabs" class="m3-pill-tabs gm3-connected-dsp" role="group" aria-label="Map view mode"></div>
            <button id="star-filter-btn" type="button" class="star-filter-btn" aria-pressed="false" aria-label="Starred only">
              <span class="ms" aria-hidden="true">star</span>
              <span id="star-btn-label" class="hud-btn-label" aria-hidden="true">Starred only</span>
            </button>
            <button id="sketch-filter-btn" type="button" class="star-filter-btn sketch-filter-btn" aria-pressed="false" aria-label="Show sketches">
              <span class="ms" aria-hidden="true">edit_note</span>
              <span id="sketch-btn-label" class="hud-btn-label" aria-hidden="true">Show sketches</span>
            </button>
            <button id="era-genai-filter-btn" type="button" class="star-filter-btn era-genai-filter-btn" aria-pressed="false" aria-label="Show Gen AI" hidden>
              <span class="ms" aria-hidden="true">auto_awesome</span>
              <span id="era-genai-btn-label" class="hud-btn-label" aria-hidden="true">Show Gen AI</span>
            </button>
          </div>
          <div id="star-empty-msg" class="star-empty-msg" hidden>No starred tracks yet — tap ★ on any track</div>
        </div>
        <canvas id="map-canvas" class="map-canvas" aria-hidden="true"></canvas>
        <svg id="map-svg" class="map-svg" role="img" aria-label="Interactive Bill Tribble Music Map"></svg>
        <div id="map-hover-pill" class="map-hover-pill" hidden></div>
      </section>

      <section id="analysis-shell" class="analysis-shell" hidden>
        <div class="analysis-top-row">
          <div id="era-strip" class="era-strip"></div>
          <div id="analysis-granularity" class="m3-pill-tabs gm3-connected-dsp" role="group" aria-label="Timeline granularity"></div>
        </div>
        <div id="view-stage" class="view-card"></div>
        <div id="era-inspector" class="era-inspector"></div>
      </section>

      <aside id="track-player-card" class="player-card" hidden aria-label="Track player"></aside>
    </main>
  </div>

  <div id="settings-popover" class="settings-pop" hidden>
    <div class="set-row">
      <div>
        <div class="set-lbl">Audio</div>
        <div class="set-sub">Audition track loops</div>
      </div>
      <label class="m3-switch" aria-label="Enable audio">
        <input id="set-mute" type="checkbox" checked />
        <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
      </label>
    </div>
    <div class="set-row">
      <span class="set-lbl">Volume</span>
      <input id="set-vol" class="gm3-slider" type="range" min="0" max="1" step="0.02" value="0.85" style="width:148px" aria-label="Master volume" />
    </div>
    <div class="set-row">
      <span class="set-lbl">Node color</span>
      <div class="m3-pill-tabs gm3-connected-dsp">
        <button type="button" class="m3-pill-tab is-active" data-set-color="cluster">Vibe</button>
        <button type="button" class="m3-pill-tab" data-set-color="energy">Energy</button>
        <button type="button" class="m3-pill-tab" data-set-color="era">Phase</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-lbl">Theme</span>
      <div class="m3-pill-tabs gm3-connected-dsp">
        <button type="button" class="m3-pill-tab is-active" data-set-theme="auto">Auto</button>
        <button type="button" class="m3-pill-tab" data-set-theme="light">Light</button>
        <button type="button" class="m3-pill-tab" data-set-theme="dark">Dark</button>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=20261124v"></script>
  <script src="js/audio-deck.js?v=20261124v"></script>
  <script src="js/timeline-era.js?v=20261124v"></script>
  <script src="js/player-card.js?v=20261124v"></script>
  <script src="js/map-physics.js?v=20261124v"></script>
  <script src="js/map-labels.js?v=20261124v"></script>
  <script src="js/nodemap.js?v=20261124v"></script>
  <script src="js/views-harmony.js?v=20261124v"></script>
  <script src="js/views-evolution.js?v=20261124v"></script>
  <script src="js/app.js?v=20261124v"></script>
  <script src="js/theme.js?v=20261124v"></script>
</body>
</html>
